街2號", "cid": "3409433525580887277", "place_id": "ChIJk882wemrQjQR7XSOQbq9UC8", "maps": "https://maps.google.com/?cid=3409433525580887277"}, "quotes": [{"speaker": "網友", "stance": "mention", "text": "烏弄、甘蔗媽媽 還有哪個？", "url": "https://www.threads.com/@zeke_6973/post/DgSVNr5k68d", "parent": null, "parent_by": null, "thread": null}], "previous": null, "decided": null}, {"key": "overseas|夢林夕大排檔||廈門", "mention_ids": ["4040106209046657382:夢林夕大排檔:other_user"], "query": "梦林夕大排档 厦门火车站", "reasons": ["medium_score"], "mentions": 1, "by_author": false, "candidate": {"name": "林夕烧酒档(没有分店)", "address": "福建省厦门市思明区后埭溪路105-101号(文灶地铁站2号口步行370米)", "cid": null, "place_id": "amap:B0FFHS2P8O", "maps": "https://uri.amap.com/poidetail?poiid=B0FFHS2P8O\u0026src=lala-food-feed"}, "quotes": [{"speaker": "網友", "stance": "recommend", "text": "梦林夕大排档、川伯四果汤也好吃", "url": "https://www.threads.com/@zeke_6973/post/DgRVzEVE3lm", "parent": null, "parent_by": null, "thread": null}], "previous": null, "decided": null}, {"key": "overseas|川伯四果湯||廈門", "mention_ids": ["4040106209046657382:川伯四果湯:other_user"], "query": "川伯四果汤 厦门火车站", "reasons": ["area_mismatch"], "mentions": 1, "by_author": false, "candidate": {"name": "黑市街川伯四果汤", "address": "福建省厦门市思明区筼筜街道屿后北里375号之二", "cid": null, "place_id": "amap:B0FFHRSDFN", "maps": "https://uri.amap.com/poidetail?poiid=B0FFHRSDFN\u0026src=lala-food-feed"}, "quotes": [{"speaker": "網友", "stance": "recommend", "text": "川伯四果汤也好吃", "url": "https://www.threads.com/@zeke_6973/post/DgRVzEVE3lm", "parent": null, "parent_by": null, "thread": null}], "previous": null, "decided": null}, {"key": "taiwan|來日方茶||遼寧街", "mention_ids": ["4040366618257308461:來日方茶:other_user"], "query": "來日方茶 遼寧街", "reasons": ["not_food_type"], "mentions": 1, "by_author": false, "candidate": {"name": "來日方茶 - 台北遼寧店", "address": "104臺北市中山區力行里遼寧街46號", "cid": "12390707923382580698", "place_id": "ChIJa3JtJTOrQjQR2jXWIDWj9Ks", "maps": "https://maps.google.com/?cid=12390707923382580698"}, "quotes": [{"speaker": "網友", "stance": "recommend", "text": "遼寧街新開的來日方茶烏龍也很好喝", "url": "https://www.threads.com/@street_photo_n/post/DgSRAhTkrst", "parent": "猜猜我在哪\n提示一条街上有3家很爱的手摇饮店", "parent_by": "拉拉熊", "thread": null}], "previous": null, "decided": null}], RZ={"amap_not_one_chain": "高德找到的分店不足以確定是同一個品牌（名字只是相近，或只有一家）", "medium_score": "名稱或地點不夠吻合", "not_food_type": "候選不是餐飲類", "area_mismatch": "地區對不上", "not_author_verified": "只有網友提到", "overseas_unverified": "海外店無法驗證", "low_score": "分數過低", "photo_only": "只從照片認出（招牌可能讀錯）", "decision_target_changed": "你審過的店已不在候選裡"}, KEY="tdp-review-v1";
let st=JSON.parse(localStorage.getItem(KEY)||"{}"), filt="all";
for(const it of ITEMS){ if(it.decided && !st[it.key]) st[it.key]=it.decided; }
const save=()=>{localStorage.setItem(KEY,JSON.stringify(st));prog();};
const prog=()=>{document.getElementById("prog").textContent=`已判斷 ${ITEMS.filter(i=>st[i.key]&&st[i.key].action).length} / ${ITEMS.length}`};
const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link=(u,t)=>(u||"").startsWith("https://")?`<a href="${esc(u)}" target=_blank rel="noopener noreferrer">${t}</a>`:"";
function card(it){
  const d=st[it.key]||{}, q=it.quotes.map(x=>`<div class="q"><span class="who ${x.speaker=="拉拉熊"?"a":"o"}">${x.speaker}</span>${esc(x.text)} ${link(x.url,"原文")}</div>`+
    (x.parent?`<div class="ctx">回覆${x.parent_by||""}：${esc(x.parent)}</div>`:"")+(x.thread?`<div class="ctx">串文：${esc(x.thread)}</div>`:"")).join("");
  const c=it.candidate, cand=c.name?`<b>我們的猜測：</b>${esc(c.name)} <span class="muted">${esc(c.address||"")}</span> ${link(c.maps,"地圖")}`:"<b>我們的猜測：</b>（沒有）";
  const prev=it.previous?`<div class="muted">你之前認可的是：${esc(it.previous.name||"")} ${link(it.previous.cid?"https://maps.google.com/?cid="+it.previous.cid:"","地圖")}</div>`:"";
  const b=(a,t)=>`<button data-k="${esc(it.key)}" data-a="${a}" class="${d.action==a?"sel":""}">${t}</button>`;
  return `<div class="card ${d.action?"done":""}" data-k="${esc(it.key)}"><div class="muted">${esc(it.query)} · 提及 ${it.mentions}${it.reasons.map(r=>`<span class="rs">${RZ[r]||r}</span>`).join("")}</div>
  ${q}<div class="cand">${cand}${prev}</div><div class="acts">${b("accept","✓ 正確")}${b("reject","✗ 不是店／不收")}${b("closed","已歇業")}${b("brand","品牌（不指定分店）")}
  <input class="fix" placeholder="✎ 正確的店：貼 Google Maps 或高德連結，按 Enter（只打店名不會自動採用）" data-k="${esc(it.key)}" value="${esc(d.action=="replace"?d.input:"")}"></div>
  <div class="acts"><input class="note" placeholder="備註（只是說明，不會拿去搜尋店家）" data-k="${esc(it.key)}" value="${esc(d.note||"")}"></div></div>`;
}
function render(){
  const L=ITEMS.filter(i=>filt=="all"||(filt=="author"&&i.by_author)||(filt=="other"&&!i.by_author)||(filt=="todo"&&!(st[i.key]&&st[i.key].action)));
  document.getElementById("list").innerHTML=L.map(card).join("")||"<p class=muted>沒有項目</p>"; prog();
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.classList.contains("tab")){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");filt=t.dataset.f;render();}
  if(t.dataset&&t.dataset.a){const it=ITEMS.find(i=>i.key==t.dataset.k);
    const note=(st[it.key]||{}).note;
    st[it.key]=st[it.key]&&st[it.key].action==t.dataset.a?(note?{note}:undefined):{action:t.dataset.a,mention_ids:it.mention_ids,query:it.query,candidate:it.candidate,...(note?{note}:{})};
    if(!st[it.key])delete st[it.key];save();render();}
  // only this page's items: the browser also keeps decisions from older pages, and exporting those again
  // would overwrite later corrections (八哥, 潮牛悅 came back with their first, wrong links)
  if(t.id=="exp"){const keys=new Set(ITEMS.map(i=>i.key)), cur={};
    for(const [k,v] of Object.entries(st)) if(keys.has(k)&&v.action) cur[k]=v;
    const out={version:1,exported_at:new Date().toISOString(),decisions:cur};
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));
    a.download="review-decisions.json";a.click();}
});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key=="Enter"&&t.classList.contains("fix")&&t.value.trim()){
  const it=ITEMS.find(i=>i.key==t.dataset.k), note=(st[it.key]||{}).note;
  st[it.key]={action:"replace",input:t.value.trim(),mention_ids:it.mention_ids,query:it.query,...(note?{note}:{})};save();render();}});
document.addEventListener("change",e=>{const t=e.target;if(!t.classList.contains("note"))return;  // a note never changes the action
  const it=ITEMS.find(i=>i.key==t.dataset.k), v=t.value.trim(), cur={...(st[it.key]||{})};
  if(v)cur.note=v;else delete cur.note;
  if(Object.keys(cur).length)st[it.key]=cur;else delete st[it.key];save();});
render();
</script></body></html>
