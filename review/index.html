function render(){

}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.classList.contains("tab")){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");filt=t.dataset.f;render();}
  if(t.dataset&&t.dataset.a){const it=ITEMS.find(i=>i.key==t.dataset.k);

    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));

});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key=="Enter"&&t.classList.contains("fix")&&t.value.trim()){

document.addEventListener("change",e=>{const t=e.target;if(!t.classList.contains("note"))return;  // a note never changes the action
